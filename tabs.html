<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello world button</title>
    <style>
        /* Style for the button */
        #helloButton {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50; /* Green */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #helloButton:hover {
            background-color: #45a049; /* Darker green */
        }

        /* Style for the link */
        a {
            display: inline-block;
            margin-top: 20px;
            font-size: 16px;
            color: #0000EE; /* Default link color */
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline; /* Underline on hover */
        }</style>
</head>
<body>
    <!--Hello world button-->
    <button id="helloButton">Hello World</button>
    <!-- My website tab with href -->   
    <a href="https://www.example.com" target="_blank">My Website</a>





    </body>
</html>
